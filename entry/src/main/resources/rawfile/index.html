<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PhotoCraft</title>
  
<script>
const nativeConsoleError = console.error.bind(console);
window.lastPhotoCraftPanic = '';
console.error = (...args) => {
  nativeConsoleError(...args);
  if (typeof args[0] === 'string' && args[0].startsWith('PhotoCraft panic:')) {
    window.lastPhotoCraftPanic = args.join(' ');
  }
};
window.addEventListener('error', (event) => {
  const detail = event.error?.stack || event.message || 'Unknown error';
  console.error('PhotoCraft startup error:', detail);
  document.getElementById('photocraft_loading').textContent = window.lastPhotoCraftPanic + '\nPhotoCraft startup error: ' + detail;
});
window.addEventListener('unhandledrejection', (event) => {
  const detail = event.reason?.stack || String(event.reason);
  console.error('PhotoCraft startup rejection:', detail);
  document.getElementById('photocraft_loading').textContent = 'PhotoCraft startup rejection: ' + detail;
});
</script>
<script type="module">
import init, * as bindings from './photocraft-web-a705b2188e2fccf8.js';
let wasm;
try {
  wasm = await init({ module_or_path: './photocraft-web-a705b2188e2fccf8_bg.wasm' });
} catch (error) {
  const detail = error instanceof Error ? (error.stack || error.message) : String(error);
  console.error('PhotoCraft WASM initialization failed:', detail);
  document.getElementById('photocraft_loading').textContent = 'PhotoCraft initialization failed: ' + detail;
  throw error;
}


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
<link rel="modulepreload" href="./photocraft-web-a705b2188e2fccf8.js" crossorigin="anonymous" integrity="sha384-XxjYUHhLs2915FZnj8OsOLfuuJC6NKQmaTCs4lvrhqqF+ZcsAw1OxNSpKvxTevOt"><link rel="preload" href="./photocraft-web-a705b2188e2fccf8_bg.wasm" crossorigin="anonymous" integrity="sha384-hqFoRa/kHDeat7ltnBuFGIBfIhNmso7MTu8PSB1HBDSEJM8CQXntZv/7XWdyJm9O" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <p>Loading PhotoCraft&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If PhotoCraft doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
